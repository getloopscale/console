#
# DEV stack — run the real applications locally for end-user validation.
# Brought up by `make dev-up` (see dev/run.sh). Persistent (no auto-teardown).
#
# Phase 1 (this section): the real backend + gateway.
#   pg-cloud   — Postgres 17 loaded with the engine's REAL schema (tenants,
#                loop_runtime_api_keys, users, …) from ../loopscale/api/internal/db/schema.gen.sql
#   pg-loopmem — pgvector for TheMemory
#   loopmem    — TheMemory REST server, REAL LLM (OPENAI_API_KEY from loopmem/.env)
#   loop-console — the gateway (host-built binary)
#
# Kratos + the Traefik single edge (:8090, kratos+dashboard+BFF+capability) +
# the nginx dashboard static service are appended below (M8 slice-3a retired Caddy).

name: loop-console-dev

services:
  pg-cloud:
    image: postgres:17-alpine
    # DB named `loopscale` to match the engine migrations (they GRANT ... ON DATABASE loopscale).
    environment:
      POSTGRES_USER: loopscale
      POSTGRES_PASSWORD: loopscale
      POSTGRES_DB: loopscale
    volumes:
      # Extensions need superuser; the migrations assume they pre-exist.
      - ./dev/sql/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      # Separate `kratos` database for Ory Kratos.
      - ./dev/sql/01-create-kratos-db.sql:/docker-entrypoint-initdb.d/01-create-kratos-db.sql:ro
      - dev_pgcloud:/var/lib/postgresql/data
    ports:
      - "${DEV_PG_CLOUD_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loopscale -d loopscale"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s

  # Applies the engine's REAL migrations (golang-migrate format) — drift-free vs
  # the committed schema.gen.sql dump. One-shot; the gateway waits for it.
  cloud-migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      pg-cloud:
        condition: service_healthy
    volumes:
      - ../loopscale/api/internal/db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://loopscale:loopscale@pg-cloud:5432/loopscale?sslmode=disable"
      - "up"
    restart: on-failure:3

  pg-loopmem:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: themem
      POSTGRES_PASSWORD: themem
      POSTGRES_DB: themem
    volumes:
      - dev_pgloopmem:/var/lib/postgresql/data
    ports:
      # Host-mapped so the host-network MCP server can reach it.
      - "${DEV_PG_LOOPMEM_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themem -d themem"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Hermetic OpenAI-compatible mock (default LLM/embeddings backend). Swap for a
  # real provider by exporting OPENAI_API_KEY + OPENAI_BASE_URL before `make dev-up`.
  mock-openai:
    build:
      context: ./dev
      dockerfile: runtime.Dockerfile
      args:
        BINARY: bin/mock-openai
    environment:
      PORT: "11434"
      MOCK_EMBED_DIM: "1536"
    ports:
      # Host-mapped so the host-network MCP server can reach it.
      - "${DEV_MOCK_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11434/healthz"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  # --- TheMemory MCP server (OpenMemory-compatible SSE) --------------------
  # `loopmem mcp --compat openmemory` exposes add_memories / search_memory /
  # list_memories / delete_memories over SSE at /{client}/sse/{user} (port 8765)
  # — a drop-in for OpenMemory-wired MCP clients (Cursor / Claude Desktop / …).
  # One-shot migrate init (live-test-gaps-fix LT-1). loopmem (REST) + loopmem-mcp
  # both run migrate-on-boot; before this, both depended only on pg-loopmem and
  # raced each other applying a new migration (CREATE INDEX IF NOT EXISTS is not
  # atomic under concurrent DDL → one container crashed). This dedicated one-shot
  # (mirrors cloud-migrate / kratos-migrate) applies migrations ONCE; the
  # long-running containers wait for its completion → zero boot-time concurrency.
  loopmem-migrate:
    image: ${LOOPMEM_IMAGE:-loopmem-e2e:latest}
    depends_on:
      pg-loopmem:
        condition: service_healthy
    entrypoint: ["/nodejs/bin/node", "/app/dist/agent-tools/cli.js"]
    command: ["migrate"]
    environment:
      THEOMEM_PG_URI: postgres://themem:themem@pg-loopmem:5432/themem
      # MUST match the runtime embedder so the vector column dim aligns.
      THEOMEM_EMBEDDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key-for-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mock-openai:11434/v1}
    restart: on-failure:3

  loopmem-mcp:
    image: ${LOOPMEM_IMAGE:-loopmem-e2e:latest}
    depends_on:
      loopmem-migrate:
        condition: service_completed_successfully
      pg-loopmem:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    # The OpenMemory SSE compat surface is unauthenticated (local-first) and
    # REFUSES to bind a non-localhost host without TLS (ADR-0015 guard). So we
    # run it on the HOST network and bind 127.0.0.1:8765 — reachable by the
    # host's MCP client (Cursor / Claude Desktop) AND guard-compliant. It then
    # reaches pg-loopmem + mock-openai via their host-mapped ports.
    network_mode: host
    # The image entrypoint hard-codes `server`; override to run `mcp`.
    entrypoint: ["/nodejs/bin/node", "/app/dist/agent-tools/cli.js"]
    command: ["mcp", "--compat", "openmemory"]
    # NOTE (LT-1): the MCP runtime runs runMigrations() UNCONDITIONALLY on boot
    # (run-mcp-server has no THEMEMORY_SKIP_MIGRATIONS flag — unlike `server`).
    # The race is already eliminated: this container waits for loopmem-migrate's
    # service_completed_successfully, so its own migrate is a post-init,
    # single-process, idempotent no-op (no concurrent DDL). Setting the skip env
    # here would be a no-op (the MCP path ignores it) — true parity is a
    # loopmem follow-up: add THEMEMORY_SKIP_MIGRATIONS to run-mcp-server.
    environment:
      THEOMEM_PG_URI: postgres://themem:themem@localhost:${DEV_PG_LOOPMEM_PORT:-15432}/themem
      THEMEMORY_API_KEY: ${LOOPMEM_MASTER_KEY:-dev-master-key}
      THEOMEM_EMBEDDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key-for-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://localhost:11434/v1}
      THEOMEM_MCP_COMPAT: openmemory
      THEOMEM_MCP_HTTP_PORT: "8765"
      # default THEOMEM_MCP_HTTP_HOST = 127.0.0.1 satisfies the ADR-0015 guard.

  # --- Ory Kratos (identity / login) ---------------------------------------
  kratos-migrate:
    image: oryd/kratos:v1.3.1
    depends_on:
      pg-cloud:
        condition: service_healthy
    environment:
      DSN: postgres://loopscale:loopscale@pg-cloud:5432/kratos?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]
    restart: on-failure:3

  kratos:
    image: oryd/kratos:v1.3.1
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    volumes:
      - ./dev/kratos:/etc/config/kratos:ro
    command: ["serve", "--config", "/etc/config/kratos/kratos.yml", "--dev", "--watch-courier"]
    ports:
      - "${DEV_KRATOS_PUBLIC_PORT:-14433}:4433"
      - "${DEV_KRATOS_ADMIN_PORT:-14434}:4434"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4433/health/ready"]
      interval: 4s
      timeout: 3s
      retries: 20
      start_period: 5s

  loopmem:
    image: ${LOOPMEM_IMAGE:-loopmem-e2e:latest}
    depends_on:
      loopmem-migrate:
        condition: service_completed_successfully
      pg-loopmem:
        condition: service_healthy
      mock-openai:
        condition: service_healthy
    environment:
      THEOMEM_PG_URI: postgres://themem:themem@pg-loopmem:5432/themem
      PORT: "8080"
      HOST: "0.0.0.0"
      THEMEMORY_API_KEY: ${LOOPMEM_MASTER_KEY:-dev-master-key}
      # Model B (confused-deputy closure): fail-closed multi-tenant mode. PROD
      # sets this true so a no-credential/verify-only request is rejected rather
      # than collapsing to the shared `default` workspace. Defaults FALSE in dev
      # so the stack boots before the gateway's platform-admin key is bootstrapped
      # (see dev/README § Model B). Set LOOPMEM_REQUIRE_CREDENTIAL=true once the
      # gateway is provisioned with a real platform-admin theo_live_* key.
      # NOTE: the canonical name is double-M THEMEMORY_ (TheMemory reads
      # process.env['THEMEMORY_REQUIRE_CREDENTIAL']); the host override token
      # below MUST match it exactly or the flip is silently ignored.
      THEMEMORY_REQUIRE_CREDENTIAL: "${THEMEMORY_REQUIRE_CREDENTIAL:-false}"
      # Bootstrap token to mint the first platform-admin key (Model B provisioning).
      THEMORY_ADMIN_BOOTSTRAP_TOKEN: ${LOOPMEM_ADMIN_BOOTSTRAP_TOKEN:-dev-bootstrap-token-change-me-min-32-chars}
      # Migrations are applied by the one-shot loopmem-migrate init (LT-1); the
      # long-running server skips its own migrate-on-boot (no concurrent DDL).
      THEMEMORY_SKIP_MIGRATIONS: "true"
      THEOMEM_EMBEDDER: openai
      # Default: hermetic mock (deterministic, no cost). Override OPENAI_API_KEY +
      # OPENAI_BASE_URL for a real provider (OpenAI / OpenRouter) → real recall.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key-for-mock}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://mock-openai:11434/v1}
    ports:
      - "${DEV_LOOPMEM_PORT:-18081}:8080"
    healthcheck:
      test:
        - "CMD"
        - "/nodejs/bin/node"
        - "-e"
        - "require('node:http').get('http://127.0.0.1:8080/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  loop-console:
    build:
      context: ./dev
      dockerfile: runtime.Dockerfile
      args:
        BINARY: bin/loop-console
    depends_on:
      cloud-migrate:
        condition: service_completed_successfully
      loopmem:
        condition: service_healthy
    environment:
      LOOP_RUNTIME_ENV: dev
      CLOUD_LISTEN_ADDR: ":13002"
      DATABASE_URL: postgres://loopscale:loopscale@pg-cloud:5432/loopscale?sslmode=disable
      LOOPMEM_BASE_URL: http://loopmem:8080
      LOOPMEM_API_KEY: ${LOOPMEM_MASTER_KEY:-dev-master-key}
      # Model B: control-plane credential the broker uses to MINT per-tenant data
      # keys (memory:platform-admin). NEVER on the data path. When unset, the
      # gateway sources the control-plane credential from LOOPMEM_API_KEY as a
      # transition fallback; provision a real platform-admin theo_live_* key
      # (via loopmem's bootstrap token) for true per-tenant isolation.
      LOOPMEM_PLATFORM_ADMIN_KEY: ${LOOPMEM_PLATFORM_ADMIN_KEY:-}
      # #331: a variavel foi REMOVIDA de proposito. Sem ela, `Load()` sorteia 32 bytes por boot
      # (config.go: devSecretFor -> generateDevSecret). Sessoes nao sobrevivem a restart, o que o
      # proprio comentario daquela funcao ja declara aceitavel em dev — e um placeholder fixo no
      # compose e justamente o que faz um segredo previsivel sobreviver ate um host publico.
      APP_PUBLIC_URL: http://localhost:${DEV_ORIGIN_PORT:-5173}
      BILLING_RETURN_URL: http://localhost:${DEV_ORIGIN_PORT:-5173}
      # Kratos wiring (Phase 2). Browser-facing URL goes through the single-origin
      # proxy; server-to-server whoami hits Kratos directly on the compose network.
      KRATOS_PUBLIC_URL: http://localhost:${DEV_ORIGIN_PORT:-5173}
      KRATOS_INTERNAL_URL: http://kratos:4433
      KRATOS_ADMIN_URL: http://kratos:4434
    ports:
      - "${DEV_GATEWAY_PORT:-13002}:13002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:13002/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  # NOTE: the dashboard runs as a host-side `vite dev` server (started by
  # dev/run.sh) on http://localhost:5173 — vite's built-in proxy forwards
  # /v1, /engine, /auth -> gateway:13002 and /self-service, /sessions ->
  # kratos:14433 (both exposed on the host). This is the dashboard's native dev
  # workflow and sidesteps the production-bundle manualChunks TDZ bug. Kratos +
  # the gateway are configured with the 5173 origin so cookies stay same-origin.

  # M8 slice-3a + dashboard-manualchunks-tdz-fix (ADR D3): the dashboard SPA static
  # server. Traefik's catch-all PathPrefix(`/`) routes here. The image BUILDS the SPA
  # from source (dev/dashboard.Dockerfile: npm ci + npm run build → nginx) so the edge
  # serves the FIXED bundle reproducibly — `dashboard/dist` is gitignored and not built
  # by dev/run.sh. Coexists with the host-side `vite dev` HMR workflow on :5173.
  dashboard:
    build:
      context: .
      dockerfile: dev/dashboard.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # platform-api-gateway edge: the Traefik SINGLE dev edge (M8 slice-3a unifies
  # kratos + dashboard + BFF + the /v1/memory capability; retires dev/caddy). Delegates
  # capability authZ to loop-console's ForwardAuth (/internal/authz/forward); the
  # /v1/memory data path goes to loopmem:8080 DIRECTLY (ADR D7).
  traefik:
    image: traefik:v3.3
    depends_on:
      loop-console:
        condition: service_healthy
      loopmem:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    volumes:
      - ./dev/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dev/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${DEV_EDGE_PORT:-8090}:8090"

volumes:
  dev_pgcloud:
  dev_pgloopmem:
