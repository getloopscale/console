  <text x="95" y="210" text-anchor="middle" font-size="9" fill="#555">use-sse-stream (canonico)</text>
  <text x="95" y="225" text-anchor="middle" font-size="9" fill="#555">4 hooks de polling</text>

  <rect x="20" y="266" width="150" height="60" rx="6" fill="#f4f4f9" stroke="#9b9bb0"/>
