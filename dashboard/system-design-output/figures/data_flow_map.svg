  <text x="305" y="215" text-anchor="middle" font-size="9" fill="#555">Idempotency-Key automatico</text>
  <text x="305" y="231" text-anchor="middle" font-size="9" fill="#c0392b">BroadcastChannel no import</text>

  <rect x="440" y="60" width="160" height="52" rx="6" fill="#eef7ee" stroke="#3d8b3d"/>
  <text x="520" y="80" text-anchor="middle" font-size="11" font-weight="600">Cloud BFF /v1/*</text>
  <text x="520" y="97" text-anchor="middle" font-size="9" fill="#555">lens · rag · memory · skills</text>

