  <text x="520" y="220" text-anchor="middle" font-size="11" font-weight="600">EventSource (SSE)</text>
  <text x="520" y="236" text-anchor="middle" font-size="9" fill="#555">?token= em 4 streams</text>
  <text x="520" y="251" text-anchor="middle" font-size="9" fill="#c0392b">withCredentials em 1 (divergente)</text>

  <rect x="440" y="284" width="160" height="52" rx="6" fill="#eef7ee" stroke="#3d8b3d"/>
