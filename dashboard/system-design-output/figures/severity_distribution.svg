    <text x="173" y="305">Dados</text><text x="173" y="316" font-size="9" fill="#666">19</text>
    <text x="247" y="305">Escala</text><text x="247" y="316" font-size="9" fill="#666">10</text>
    <text x="321" y="305">Delecao</text><text x="321" y="316" font-size="9" fill="#666">24</text>
    <text x="395" y="305">Trade-offs</text><text x="395" y="316" font-size="9" fill="#666">19</text>
