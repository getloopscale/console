<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" font-family="system-ui,sans-serif">
  <rect width="480" height="340" fill="#ffffff"/>
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Distribuicao de severidade por dimensao (n=91)</text>
