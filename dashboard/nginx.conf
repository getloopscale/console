server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hide nginx version in responses/error pages.
    server_tokens off;

    # B-100 — os headers de segurança vivem em `nginx-security-headers.conf`, e
    # cada `location` que declara header próprio inclui o mesmo arquivo. A razão
    # é a regra de herança do nginx: `add_header` num nível descarta os do nível
    # anterior, então um `Cache-Control` acrescentado sem o include derrubaria o
    # CSP naquele caminho — sem erro e sem aviso.
    include /etc/nginx/security-headers.conf;

    # #342 (LT-051) — superficie de API NUNCA cai no catch-all da SPA.
    #
    # `try_files $uri /index.html` devolve index.html com 200 para qualquer path que nao seja
    # arquivo. Quando o edge encaminha aqui um path de API que nao casou rota de produto, o
    # cliente recebe `200 text/html`: status de sucesso com corpo de outro tipo, que e a pior
    # forma de falhar — `resp.ok` e true e um SDK segue em frente com um blob de HTML.
    #
    # MEDIDO em app-dev, 2026-08-02, sem credencial:
    #   /health -> 200 application/json   (roteado ao cloud-API, correto)
    #   /ready  -> 200 text/html          <-- a sonda de readiness do #338, engolida
    #
    # O /ready existe para poder REPROVAR. Devolvendo 200 HTML, um verificador externo apontado
    # para ele ficaria verde para sempre — o mesmo defeito do LT-040/LT-041, produzido por outra
    # camada. Com esta guarda ele passa a 404 JSON: ainda nao e a sonda (falta o edge rotea-la ao
    # cloud-API), mas falha ALTO em vez de mentir.
    #
    # Regex location tem precedencia sobre prefixo no nginx, entao esta guarda vence o `location /`
    # abaixo independentemente da ordem — mantida aqui em cima para quem le.
    location ~ ^/(v1|ready|health|metrics)(/|$) {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"no such API route"}';
    }

    # B-100 — POLÍTICA DE CACHE.
    #
    # Até aqui o nginx não emitia header de cache nenhum: só `ETag`/`Last-Modified`,
    # o que faz cada asset pagar uma revalidação condicional por carregamento. Isso
    # também era o pré-requisito não cumprido da opção 3 do `ADR-0004` (remover o
    # service worker): sem estes headers, tirá-lo pioraria a entrega.

    # Assets do Vite — nome com hash de conteúdo, então build novo produz nome
    # novo e uma entrada velha nunca é servida no lugar de uma nova. É a condição
    # que torna `immutable` seguro: o navegador nem revalida no F5.
    #
    # `^~` para vencer as `location` por regex sem depender da ordem do arquivo.
    location ^~ /assets/ {
    include /etc/nginx/security-headers.conf;
        # SEM `always`, de propósito. Com ele o header valeria também em 4xx/5xx, e um
        # 404 de asset seria cacheado por um ano — o modo de falha clássico do deploy
        # rolling: o cliente carrega o `index.html` novo de um pod, pede o asset a
        # outro que ainda não o tem, recebe 404 e o guarda até o nome mudar de novo.
        #
        # Sem `always`, o nginx só emite em 2xx/3xx. Os headers de segurança mantêm o
        # `always` porque para eles é o inverso: uma página de erro é exatamente onde
        # conteúdo do atacante pode ser refletido.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O SERVICE WORKER NÃO TEM HASH NO NOME, e é por isso que ele tem bloco
    # próprio: cair na regra dos assets o congelaria na versão do dia em que a
    # regra entrou, e o app nunca mais receberia atualização. O sintoma apareceria
    # só no deploy SEGUINTE, quando a causa já não é óbvia.
    #
    # `no-cache` e não `no-store`: revalidar é barato (um 304), não guardar é
    # desperdício.
    location = /sw.js {
    include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # A config de runtime carrega valores que rotacionam. Cacheá-la faria uma
    # rotação não chegar ao navegador.
    location = /__config.js {
    include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # O `index.html` é o MAPA para os assets com hash. Cacheá-lo prende a pessoa
    # numa geração de nomes que já não existe no disco — o modo de falha em que a
    # tela fica branca depois de um deploy.
    location / {
    include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
