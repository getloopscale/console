server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hide nginx version in responses/error pages.
    server_tokens off;

    # Browser security headers (find_infra_012). The CSP is the primary
    # mitigation that limits the blast radius of any XSS — combined with the
    # dashboard no longer broadcasting the JWT over BroadcastChannel (find_sec_004),
    # this breaks the token-theft chain (CHAIN-3).
    #   - default/script/connect 'self': the SPA + its runtime /__config.js and all
    #     BFF API calls are same-origin (MEET-040), so no remote origins are needed.
    #   - style 'unsafe-inline': Tailwind and small inline style attributes require it.
    #   - frame-ancestors 'none' + X-Frame-Options DENY: clickjacking protection.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # form-action + connect-src extended to the Kratos public host so the
    # dashboard's login/registration forms POST cross-origin to auth.usetheo.dev.
    # Per plan 2026-05-29-dashboard-public-integration-canonicalization Phase 8
    # LIVE fix 2026-06-01.
    # form-action covers initial POST + every redirect target during the
    # form submission. OIDC providers (Google/GitHub) are redirect targets
    # of the Kratos OAuth dance — must be listed explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://auth.usetheo.dev https://cloud.usetheo.dev; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.usetheo.dev https://accounts.google.com https://github.com; frame-ancestors 'none'" always;

    # #342 (LT-051) — superficie de API NUNCA cai no catch-all da SPA.
    #
    # `try_files $uri /index.html` devolve index.html com 200 para qualquer path que nao seja
    # arquivo. Quando o edge encaminha aqui um path de API que nao casou rota de produto, o
    # cliente recebe `200 text/html`: status de sucesso com corpo de outro tipo, que e a pior
    # forma de falhar — `resp.ok` e true e um SDK segue em frente com um blob de HTML.
    #
    # MEDIDO em app-dev, 2026-08-02, sem credencial:
    #   /health -> 200 application/json   (roteado ao cloud-API, correto)
    #   /ready  -> 200 text/html          <-- a sonda de readiness do #338, engolida
    #
    # O /ready existe para poder REPROVAR. Devolvendo 200 HTML, um verificador externo apontado
    # para ele ficaria verde para sempre — o mesmo defeito do LT-040/LT-041, produzido por outra
    # camada. Com esta guarda ele passa a 404 JSON: ainda nao e a sonda (falta o edge rotea-la ao
    # cloud-API), mas falha ALTO em vez de mentir.
    #
    # Regex location tem precedencia sobre prefixo no nginx, entao esta guarda vence o `location /`
    # abaixo independentemente da ordem — mantida aqui em cima para quem le.
    location ~ ^/(v1|ready|health|metrics)(/|$) {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"no such API route"}';
    }

    location / {
        try_files $uri /index.html;
    }
}
