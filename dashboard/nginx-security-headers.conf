# Headers de segurança do navegador (find_infra_012).
#
# ## Por que num arquivo separado (B-100)
#
# No nginx, as diretivas `add_header` de um nível valem *se e somente se* o nível
# atual não declarar nenhuma. Quando a política de cache entrou, cada `location`
# que passou a declarar `Cache-Control` deixou de herdar estes headers — em
# silêncio, sem erro, e justamente nos caminhos que servem JavaScript.
#
# Repetir o CSP em cada bloco também funcionaria hoje. Divergiria depois: são
# quatro linhas longas, e a que ficar para trás numa atualização é a que ninguém
# percebe. Um arquivo, incluído onde for preciso.
#
# `always` em todos: sem ele o nginx omite o header em respostas 4xx/5xx, que é
# exatamente onde uma página de erro pode refletir conteúdo do atacante.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# O CSP é a mitigação primária de XSS — combinado com o dashboard não mais
# transmitir o JWT por BroadcastChannel (find_sec_004), ele quebra a cadeia de
# roubo de token (CHAIN-3).
#
# ## The only policy, with the environment's origins from the deployment
#
# A browser applies every policy it receives and allows only their intersection, so
# index.html declares none. The hosts this policy cannot know (the Kratos public host
# and the control plane's, which differ per environment) come from two nginx variables
# defined in conf.d/csp-origins.conf: `$csp_connect_origins` for connect-src and
# `$csp_form_origins` for form-action. The image ships them empty (same-origin only,
# nginx-csp-origins.conf); a deployment mounts its own file. `src/build/csp.test.ts`
# keeps environment hosts out of this file.
#
# ## O que o conjunto contém, e por quê (medido em 2026-08-11)
#   - fonts are served by the dashboard itself (`@getloopscale/ui/fonts.css`), so no font host.
#   - img `blob:`: preview de imagem do workspace (`workspace/overview.tsx`).
#   - img `https://cdn.svgporn.com`: logos de provider do RAG. Substitui o
#     `https:` genérico que o `<meta>` trazia — um host nomeado em vez de toda a
#     web.
#   - connect: the Kratos and control-plane hosts of the environment,
#     `$csp_connect_origins` (see above).
#   - form-action cobre o POST inicial de login/registro E cada destino de
#     redirect; os provedores OIDC são destinos da dança OAuth do Kratos.
#   - `ws:`/`wss:` e os hosts do Stripe SAÍRAM: não há WebSocket no código, e o
#     Stripe é alcançado por NAVEGAÇÃO (portal/checkout), que `connect-src` não
#     governa. Eram permissões mortas, e permissão morta num CSP é superfície.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://cdn.svgporn.com; connect-src 'self' $csp_connect_origins; form-action 'self' $csp_form_origins https://accounts.google.com https://github.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
