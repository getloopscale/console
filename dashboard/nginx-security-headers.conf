# Headers de segurança do navegador (find_infra_012).
#
# ## Por que num arquivo separado (B-100)
#
# No nginx, as diretivas `add_header` de um nível valem *se e somente se* o nível
# atual não declarar nenhuma. Quando a política de cache entrou, cada `location`
# que passou a declarar `Cache-Control` deixou de herdar estes headers — em
# silêncio, sem erro, e justamente nos caminhos que servem JavaScript.
#
# Repetir o CSP em cada bloco também funcionaria hoje. Divergiria depois: são
# quatro linhas longas, e a que ficar para trás numa atualização é a que ninguém
# percebe. Um arquivo, incluído onde for preciso.
#
# `always` em todos: sem ele o nginx omite o header em respostas 4xx/5xx, que é
# exatamente onde uma página de erro pode refletir conteúdo do atacante.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# O CSP é a mitigação primária de XSS — combinado com o dashboard não mais
# transmitir o JWT por BroadcastChannel (find_sec_004), ele quebra a cadeia de
# roubo de token (CHAIN-3).
#   - default/script/connect 'self': a SPA, o `/__config.js` de runtime e toda
#     chamada de API são same-origin (MEET-040), então nenhuma origem remota é
#     necessária.
#   - style 'unsafe-inline': o Tailwind e atributos `style` curtos exigem.
#   - frame-ancestors 'none' + X-Frame-Options DENY: proteção contra clickjacking.
#   - form-action + connect-src estendidos ao host público do Kratos porque os
#     formulários de login/registro fazem POST cross-origin para auth.usetheo.dev.
#     `form-action` cobre o POST inicial E cada destino de redirect durante o
#     envio; os provedores OIDC (Google/GitHub) são destinos da dança OAuth do
#     Kratos e precisam estar listados explicitamente.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://auth.usetheo.dev https://cloud.usetheo.dev; object-src 'none'; base-uri 'self'; form-action 'self' https://auth.usetheo.dev https://accounts.google.com https://github.com; frame-ancestors 'none'" always;
