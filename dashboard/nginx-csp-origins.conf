# The origins this deployment's Content-Security-Policy adds to 'self'
# (nginx-security-headers.conf): `$csp_connect_origins` to connect-src (the Kratos
# public host the auth flows read, the control plane's), `$csp_form_origins` to
# form-action (the Kratos public host the sign-in and sign-up forms post to).
#
# The map source is a constant string: the value never depends on the request.
#
# Installed as /etc/nginx/conf.d/csp-origins.conf, at http level. Empty here: an
# image run as it is serves same-origin only. A deployment replaces the file, for
# example:
#
#   map "" $csp_connect_origins { default "https://auth.example.com https://cloud.example.com"; }
#   map "" $csp_form_origins { default "https://auth.example.com"; }
map "" $csp_connect_origins { default ""; }
map "" $csp_form_origins { default ""; }
