<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Content-Security-Policy is the nginx header (nginx-security-headers.conf), the
         only one: a <meta> policy here would be intersected with it, and could not take
         the origins a deployment configures (nginx-csp-origins.conf). -->
    <!-- LoopScale brand favicons, copied from the brand kit (getloopscale/brand, web/)
         for #521, replacing the LoopScale mark. The SVG favicon renders crisp at
         any size in modern browsers; the PNG/ico set is the fallback (ico
         sizes="any" lets legacy browsers pick the embedded size that fits). -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <!-- Geist + Geist Mono (Google Fonts CDN). Moved out of `@getloopscale/loopzero-ui/fonts-cdn.css`
         because CSS spec forbids `@import url(...)` after non-import statements,
         and `@import 'tailwindcss'` in src/index.css inlines thousands of rules
         before any subsequent CSS @import block. The <link> path also avoids
         render-blocking the critical CSS pipeline.
         CSP `style-src https://fonts.googleapis.com` + `font-src https://fonts.gstatic.com`
         already covers this (see nginx-security-headers.conf). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    />
    <title>LoopScale</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/__config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
