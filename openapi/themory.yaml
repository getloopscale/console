#
# cloud -> theo-data (TheMemory) CONSUMER contract (OpenAPI 3.0.3).
#
# CONFORMANCE NOTE (2026-06-18 — conform-to-provider): this file is the SUBSET
# of TheMemory's REAL, code-generated OpenAPI (served by the provider at
# `GET /v1/openapi.json`) that internal/themory/client.go actually calls. It
# replaces the earlier hand-authored consumer-EXPECTATION spec, which had
# diverged from the real server (`/memories`, `/metrics`, `/entities`,
# `DELETE /memories/{id}`, `X-Theo-User-Id` scoping — none of which exist).
#
# The provider owns the contract; this is the gateway conforming to it. Keep it
# in sync with the provider's `/v1/openapi.json`. The full end-to-end contract is
# additionally proven by tests/e2e against the real running server.
openapi: 3.0.3
info:
  title: TheMemory API (cloud consumer subset)
  version: "2.0.0"

servers:
  - url: /

components:
  parameters:
    Authorization:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
      description: "Bearer <master TheMemory key> (held by the gateway, never the customer)"

paths:
  /v1/scopes/{type}/{id}/memories:
    get:
      summary: List memories for a scope (subject-in-path)
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { name: type, in: path, required: true, schema: { type: string, enum: [user, session, agent] } }
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string }, description: "RFC3339 lower bound on created_at (ADR D3)" }
        - { name: to, in: query, required: false, schema: { type: string }, description: "RFC3339 upper bound on created_at (ADR D3)" }
      responses:
        "200":
          description: paginated scope listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                  nextCursor:
                    type: string
                    nullable: true
                additionalProperties: true

  /v1/scopes/{type}/{id}/metrics:
    get:
      summary: Subject-scoped memory KPIs
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { name: type, in: path, required: true, schema: { type: string, enum: [user, session, agent] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: scope KPIs
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_memories: { type: integer }
                  entity_count: { type: integer }
                  add_events: { type: integer }
                  retrieval_api_usage: { type: integer }
                additionalProperties: true

  /v1/scopes/{type}/{id}/entities:
    get:
      summary: Subject-scoped entity aggregation
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { name: type, in: path, required: true, schema: { type: string, enum: [user, session, agent] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: aggregated entities
          content:
            application/json:
              schema:
                type: object
                properties:
                  entities:
                    type: array
                    items: { type: object, additionalProperties: true }
                additionalProperties: true

  /v1/scopes/{type}/{id}/graph:
    get:
      summary: Subject-scoped entity relation graph ({nodes, edges})
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
        - { name: type, in: path, required: true, schema: { type: string, enum: [user, session, agent] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: entity relation graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { type: object, additionalProperties: true }
                  edges:
                    type: array
                    items: { type: object, additionalProperties: true }
                additionalProperties: true

  /v1/forget:
    post:
      summary: Forget (delete) one memory by id (workspace-scoped on the provider)
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memoryId]
              properties:
                memoryId: { type: string }
                hard: { type: boolean }
      responses:
        "204": { description: deleted (no content) }
        "404": { description: not found (existence-leak-safe) }

  /v1/remember:
    post:
      summary: Remember (write) a memory under a scope
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, text]
              properties:
                userId: { type: string }
                text: { type: string }
                category: { type: string }
                metadata: { type: object, additionalProperties: { type: string } }
                attributedTo: { type: string, description: "multi-peer attribution (v1.1)" }
                infer: { type: boolean, description: "false = verbatim path (required for caller attributedTo to persist)" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }
                additionalProperties: true

  /v1/recall:
    post:
      summary: Recall (semantic search) under a scope
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, query]
              properties:
                userId: { type: string }
                query: { type: string }
                topK: { type: integer }
                threshold: { type: number }
                asOf: { type: string, description: "RFC3339 bi-temporal point-in-time (v1.1)" }
                attributedTo: { type: string }
      responses:
        "200":
          description: scored results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { type: object, additionalProperties: true }
                additionalProperties: true

  /v1/reflect:
    post:
      summary: Reflect (consolidation) under a scope
      parameters:
        - { $ref: "#/components/parameters/Authorization" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                maxIterations: { type: integer }
      responses:
        "202":
          description: reflection result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
