agent: review-modal-primitive-consolidation-domain-frontend
review_target: main..HEAD for plan modal-primitive-consolidation (commits 59c4866b, 18017351, a8124007, 26c7976b)
domain: frontend
domain_specific_patterns_checked:
  - "a11y: accessible name of the dialog (Radix Title -> <h2>, aria-labelledby)"
  - "a11y: decorative icons inside the title carry aria-hidden"
  - "a11y: initial focus on Cancel (cancelRef) in destructive confirmations"
  - "a11y/HTML: Radix Description renders <p> — block children produce invalid nesting"
  - "visual: Dialog.Body (min-h-0 flex-1 overflow-y-auto) removal vs AppModal children wrapper"
  - "visual: JSX whitespace preserved when multiline title/description were folded into props"
  - "Rule 9 (Don't Reinvent): the stated justification for hand-rolling a Radix wrapper"

method: |
  Read app-modal.tsx (HEAD) and the deleted ui/dialog.tsx (git show 43387f1e).
  Diffed all 17 migrated call sites against 43387f1e.
  MEASURED with vitest + jsdom: rendered CancelBuildDialog / RollbackDialog /
  PromoteToProductionDialog / ConfirmDialog / DeleteEnvironmentDialog and dumped
  the real DOM text, the <h2> accessible name, document.activeElement and React's
  console.error stream. The throwaway test file was deleted after the run
  (git status clean of dashboard/ changes).
  Inspected the INSTALLED dependency at node_modules/@usetheo/ui/dist/index.js.

findings:
  - id: F-dom-1
    severity: HIGH
    file: dashboard/src/pages/deploy/components/promote-to-production-dialog.tsx
    line: 162
    plan_ref: "Phase 2 — migrar os 14 call sites restantes; Global DoD 'paridade visual'"
    domain_anchor: "WAI-ARIA dialog contract — the accessible name is the Title subtree text (app-modal.tsx:84-86 renders it into RadixDialog.Title)"
    summary: >
      The migration lost the JSX-significant whitespace around {sha}, corrupting BOTH the
      dialog's accessible name and its body copy. The screen reader announces
      "Promote abcdef1to production"; the visible description reads
      "This will make abcdef1the production deploy of web". This is the one modal in the
      set whose accessible NAME is damaged, not just its prose — it is the production
      promotion confirmation.
    evidence: |
      Before (43387f1e:promote-to-production-dialog.tsx:162-172) — newline between the
      expression and the following word, which JSX collapses to a single space:
        <Dialog.Title className="inline-flex items-center gap-2">
          <ArrowUpToLine className="size-5 text-primary" aria-hidden="true" />
          Promote {sha} to production
        </Dialog.Title>
        <Dialog.Description>
          This will make <span className="font-mono">{sha}</span> the
          production deploy of{' '}

      After (HEAD:162-163) — the space is gone:
        title={<span className="inline-flex items-center gap-2"><ArrowUpToLine className="size-5 text-primary" aria-hidden="true" />Promote {sha}to production</span>}
        description={<>This will make <span className="font-mono">{sha}</span>the
              production deploy of{' '}<span className="font-mono">{projectName}</span>. …

      MEASURED (vitest + jsdom, commit_sha "abcdef1234567890", environment "production"):
        accessible-name="Promote abcdef1to production"
        <h2> "Promote abcdef1to production"
        <p>  "This will make abcdef1the production deploy of web. Visitors will see …"
    recommended_action: >
      Restore the spaces: `Promote {sha} to production` and `<span …>{sha}</span> the`.
      Then add a rendered-text assertion (not a source grep) for the three deploy
      confirmations — the existing modal-primitive.test.ts quantifies over structure and
      is blind to this class entirely.

  - id: F-dom-2
    severity: MEDIUM
    file: dashboard/src/pages/deploy/components/rollback-dialog.tsx
    line: 139
    plan_ref: "Phase 2 — migrar os 14 call sites restantes"
    domain_anchor: "JSX whitespace semantics — a newline adjacent to a tag is trimmed, a newline between text is collapsed to one space"
    summary: >
      Same whitespace loss in the rollback confirmation's description: the environment
      name is glued to the next word. The user is asked to confirm a destructive rollback
      while reading "current release in productionwith the build from commit abcdef1".
    evidence: |
      Before (43387f1e:rollback-dialog.tsx:143):
        This will replace the current release in <span className="font-mono">{targetBuild.environment}</span> with the build from commit <span className="font-mono">{sha}</span>.
      After (HEAD:139):
        description={<>This will replace the current release in <span className="font-mono">{targetBuild.environment}</span>with the build from commit <span className="font-mono">{sha}</span>.</>}
                                                                                                                          ^ space removed
      MEASURED (vitest + jsdom):
        <p> "This will replace the current release in productionwith the build from commit abcdef1."
    recommended_action: "Re-insert the space before `with`."

  - id: F-dom-3
    severity: MEDIUM
    file: dashboard/src/pages/deploy/components/cancel-build-dialog.tsx
    line: 62
    plan_ref: "Phase 2 — migrar os 14 call sites restantes"
    domain_anchor: "JSX whitespace semantics"
    summary: >
      Same defect in the cancel-build confirmation: "The active release in productionis
