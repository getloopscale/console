plan_drift:
  plan_edited_after_implement: true
  details: |
    O plano nasceu em `43387f1e` (2026-08-09 12:24) e foi editado DUAS VEZES depois
    do início da implementação:

      59c4866b  12:30  Fase 1  (implementação começa)
      18017351  18:08  Fases 2 e 3
      a8124007  18:42  EDITA O PLANO — Global DoD preenchido + 1 critério REESCRITO
      3074fb05  22:31  EDITA O PLANO — D4 emendado, já durante o /review

    A primeira edição é em parte o ciclo de vida normal de um DoD (marcar itens com
    evidência). O que NÃO é normal está isolado em F-xval-3: um dos critérios teve o
    TEXTO trocado antes de ser marcado `[x]`.

    A segunda edição ocorreu com o /review em curso. Não invalida o trabalho — ela
    corrige um defeito real que o review de arquitetura mediu —, mas significa que o
    plano não é um contrato congelado nesta revisão, e um leitor futuro que comparar
    "o plano" com "os commits" verá um plano que já absorveu parte do resultado.

    E ela custou caro estruturalmente: o mesmo hunk apagou QUATRO seções do plano
    (`Drawbacks & Risks`, `Unresolved Questions`, `Dependency Graph` e o cabeçalho
    `Phase 1`) — F-xval-14. Editar o contrato durante a auditoria dele é exatamente
    onde esse tipo de dano passa despercebido.

