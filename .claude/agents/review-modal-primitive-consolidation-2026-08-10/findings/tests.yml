  - id: F-tests-5
    severity: MEDIUM
    file: dashboard/src/components/dialogs/confirm-dialog.tsx
    line: 67
    plan_ref: ".claude/rules/testing.md § 4.1 (casos negativos) e § 6 ('testar só o happy path')"
    summary: >-
      O componente de confirmacao destrutiva com 29 consumidores fecha SO no sucesso — e essa
