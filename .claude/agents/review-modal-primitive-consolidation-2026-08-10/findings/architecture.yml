    file: dashboard/src/components/ui/app-modal.tsx
    line: 55
    plan_ref: "Goal · Coverage Matrix row 2 (4 portas de entrada → 1)"
    summary: >-
      Fan-in — no issues found, and the generic >5-importer heuristic is reported here as NOT
      applicable rather than mechanically flagged. `AppModal` now has 30 production importers;
      for a UI primitive that number IS the objective of the plan, not a god-object signal.
    evidence: |
      ```
      grep -rl "components/ui/app-modal" dashboard/src --include='*.ts*' | grep -v '\.test\.' | wc -l  → 30
