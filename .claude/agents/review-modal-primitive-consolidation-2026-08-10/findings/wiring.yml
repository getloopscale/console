  - id: F-wire-6
    severity: LOW
    file: .claude/skills/review/scripts/consolidate_findings.py
    line: 247
    plan_ref: cycle-review — per-agent findings consolidation
    summary: >
      Harness defect surfaced while filing this report: the consolidator reads only `*.yml`,
      but this agent was instructed to write `wiring.yaml`. An agent that followed the
      instruction literally would have its entire findings file silently dropped from the
      consolidated review.
    evidence: |
      consolidate_findings.py:247 — `for yml_path in sorted(args.findings_dir.glob("*.yml")):`
      The agent definition at
      .claude/agents/review-modal-primitive-consolidation-2026-08-10/wiring.md:77 says
      `findings/wiring.yml`; the dispatching instruction for this run said
      `findings/wiring.yaml`. The two disagree, and only one of them is read.
      Mitigation applied here: I wrote BOTH paths with identical content. Because the glob
      matches only `.yml`, this does not double-count today — but it would the moment the
      glob is widened to `*.y*ml`.
      This is not hypothetical. Listing the findings dir at 22:36 during this very review
      run shows a sibling agent already caught by it:
        architecture.yaml    architecture.yml     (both -> will be read)
        tests.yaml           tests.yml            (both -> will be read)
        domain-frontend.yaml (NO .yml twin        -> will be SILENTLY DROPPED)
        wiring.yaml          wiring.yml           (both -> will be read)
      So the consolidated review for this plan is, as things stand, missing the entire
      domain-frontend agent's findings, and nothing in the pipeline reports the omission.
    recommended_action: >
      Widen the glob to `*.y*ml` AND de-duplicate by agent name, or fix the dispatch text to
      say `.yml`. A consolidator that silently skips an unreadable/unmatched agent file is
      the meta-defect class cycle-judge-codex `:final` exists to catch.

verdict_input:
  blockers: 0
  high: 0
  medium: 2
  low: 3
  info: 1
  wiring_opinion: >
    The central risk of this migration — a `type="submit"` stranded outside its `<form>` by
    the footer being rendered outside the children — is CLOSED, and closed on evidence
    rather than on reading. All 12 footer submits carry a `form=` that resolves to a real
    form with an onSubmit; the attribute demonstrably reaches the DOM button through
    @usetheo/ui's prop spread; and two call-site tests click a submit that is physically
    outside its form and assert the mutation fired. Nothing is orphaned, the 29 ConfirmDialog
    consumers are intact, and the deleted ui/dialog.tsx leaves no live reference.
    What remains is residue, not risk: an orphan doc-comment and a stale file:line from the
    dead-export commit, an undeclared dependency the slice concentrated rather than created,
    and a contract asserted everywhere except in the primitive that owns it.
