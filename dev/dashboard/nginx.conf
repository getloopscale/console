#
# M8 slice-3a (ADR D2): static server for the dashboard SPA behind the unified
# Traefik edge. Traefik has no native file server, so the catch-all PathPrefix(`/`)
# router proxies here. `try_files` reproduces the history-API fallback that the
# retired dev/caddy/Caddyfile did with `try_files {path} /index.html` — deep links
# (client-side routes) resolve to the SPA shell instead of 404ing.
#
# This serves the PRODUCTION bundle (dashboard/dist) on the production-like edge
# origin (:8090). The dashboard's HMR dev workflow (host-side `vite dev` on :5173,
# started by dev/run.sh) is unchanged and coexists with this.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
