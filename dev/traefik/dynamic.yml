# platform-api-gateway edge — Traefik DYNAMIC config (dev, single unified edge).
#
# M8 slice-3a: Traefik is the SINGLE dev edge (retires dev/caddy). Routers, by
# explicit priority (ADR D3 — rule-length already makes the longer rule win, the
# explicit `priority` is defense-in-depth so a future rule edit can't reorder):
#   memory-edge   (100)  /v1/memory/*                         → forward-auth → memory-rewrite → loopmem:8080  (M6, ADR D7)
#   bff           (10)   /v1, /engine, /health                → loop-console:13002 (cloud-API / engine proxy)
#   kratos        (rule-length)  /self-service,/sessions,/.well-known/ory → kratos:4433
#   dashboard-spa (1)    /  (catch-all)                       → nginx dashboard static (SPA history-fallback lives in nginx.conf)
#
# Capability flow (unchanged from M6): forward-auth delegates authZ to loop-console
# /internal/authz/forward; authResponseHeaders=[Authorization] does Del-then-set,
# stripping the client key (D3); memory-rewrite maps /v1/memory/recall → /v1/recall.
# The /v1/memory data upstream is loopmem DIRECTLY (ADR D7), never the BFF.

http:
  routers:
    # loopscale-workspace#7: gateway-OWNED customer paths under /v1/memory. These are
    # loop-console's own scope-guarded (theo_live_*) mounts (skills authoring/list,
    # exports, webhooks) — NOT loopmem data verbs. They MUST reach the BFF, not be
    # rewritten to loopmem (→ 404). Priority 110 beats memory-edge(100). NO
    # middlewares: (a) no memory-rewrite — loop-console owns the /v1/memory/* path
    # verbatim; (b) no forward-auth — the customer's theo_live_* key must reach
    # loop-console's RequireScope intact (forward-auth would Del-then-set it to a
    # loopmem-minted key that pg-cloud cannot resolve → 401). loop-console does its
    # OWN Model B broker exchange downstream to loopmem.
    memory-gateway-edge:
      priority: 110
      rule: "PathPrefix(`/v1/memory/skills`) || PathPrefix(`/v1/memory/exports`) || PathPrefix(`/v1/memory/webhooks`)"
      entryPoints:
        - web
      service: loop-console-bff

    # Capability namespace — highest priority so it always beats the /v1 BFF route.
    memory-edge:
      priority: 100
      rule: "PathPrefix(`/v1/memory`)"
      entryPoints:
        - web
      service: loopmem
      middlewares:
        - forward-auth
        - memory-rewrite

    # Cloud-API (BFF) — non-capability /v1, the engine proxy, and health.
    bff:
      priority: 10
      rule: "PathPrefix(`/v1`) || PathPrefix(`/engine`) || Path(`/health`)"
      entryPoints:
        - web
      service: loop-console-bff

    # Ory Kratos auth flows. Explicit priority (50) — above the SPA catch-all and
    # the BFF, below the memory capability — so ADR D3's defense-in-depth covers ALL
    # routers (not just memory/bff/spa), guarding against a future rule edit silently
    # reordering kratos relative to the catch-all. Paths are disjoint from /v1 anyway.
    kratos:
      priority: 50
      rule: "PathPrefix(`/self-service`) || PathPrefix(`/sessions`) || PathPrefix(`/.well-known/ory`)"
      entryPoints:
        - web
      service: kratos

    # SPA catch-all — lowest priority; everything not matched above is the dashboard.
    dashboard-spa:
      priority: 1
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: dashboard

  middlewares:
    # D3 (+ credential exchange): delegate authZ to loop-console; copy ONLY the minted
    # Authorization onto the upstream request (Del-then-set strips the client's). On a
    # non-2xx from the authz endpoint, Traefik denies (no upstream call).
    forward-auth:
      forwardAuth:
        address: "http://loop-console:13002/internal/authz/forward"
        authResponseHeaders:
          - "Authorization"
        trustForwardHeader: false

    # Capability namespace → loopmem native path: /v1/memory/recall → /v1/recall.
    memory-rewrite:
      replacePathRegex:
        regex: "^/v1/memory/(.*)"
        replacement: "/v1/$1"

  services:
    loopmem:
      loadBalancer:
        servers:
          - url: "http://loopmem:8080"
    loop-console-bff:
      loadBalancer:
        servers:
          - url: "http://loop-console:13002"
    kratos:
      loadBalancer:
        servers:
          - url: "http://kratos:4433"
    dashboard:
      loadBalancer:
        servers:
          - url: "http://dashboard:80"

  # ADR D4 — TLS-to-backend scaffold for the internal authz hop. DEFINED but NOT
  # referenced by any dev service (dev stays http:// so `up` is one command — R3).
  # The PROD overlay sets the authz/BFF service `serversTransport: internal-tls` and
  # flips its url to https://; `certificates:` (client certs for mTLS) are added in
  # the prod overlay where the cert material exists. See dev/traefik/README.md.
  serversTransports:
    internal-tls:
      serverName: "loop-console.internal"
      rootCAs:
        - "/etc/traefik/certs/dev-ca.pem"
      insecureSkipVerify: false
