#
# EDGE overlay for the hermetic e2e stack (issue #113). Adds the Traefik single
# edge (:8090) on top of docker-compose.e2e.yaml so the edge ForwardAuth
# confused-deputy tests (TestEdgeForwardAuth*) run in CI instead of SKIPping.
#
# Compose with the base file (same project name so it shares the network):
#   docker compose -f docker-compose.e2e.yaml -f docker-compose.edge.e2e.yaml up -d
# Driven by `EDGE=1 bash tests/e2e/run.sh` (make e2e-edge).
#
# Scope: ONLY the /v1/memory ForwardAuth router (see traefik/dynamic.e2e.yml). The
# unified SPA/Kratos/BFF edge (M8 slice-3a) needs the dashboard image and is out of
# scope for the ForwardAuth coverage gap this overlay closes.

services:
  # M18 (KEYSTONE) — the hermetic rag ForwardAuth proof. A REAL theo-rag container
  # (built from the sibling checkout, pinned M11/M12/M13) + its pgvector DB + a
  # one-shot migrate that applies theo-rag's drizzle SQLs. Mirrors the themory service.
  pg-rag:
    image: ankane/pgvector:v0.5.1   # theo-rag's 0000 migration uses the `vector` type + HNSW index
    environment:
      POSTGRES_USER: therag
      POSTGRES_PASSWORD: therag
      POSTGRES_DB: therag
    volumes:
      # initdb: the vector extension + rag_app / rag_worker. therag owns the schema and
      # only migrates; the migrate command grants the roles but never creates them.
      - ./sql/rag:/docker-entrypoint-initdb.d:ro
    ports:
      - "${E2E_PG_RAG_PORT:-55435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therag -d therag"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: theo-rag's own migrate command, from the same image the API runs (theo#474).
  # It applies the pending migrations under an advisory lock, installs the pg-boss schema
  # and grants rag_app / rag_worker. This replaces the psql loop over the drizzle SQLs,
  # which never granted the application roles. `rag` waits for it to exit 0.
  rag-migrate:
    image: ${THEORAG_IMAGE:-theo-rag-e2e:latest}
    depends_on:
      pg-rag:
        condition: service_healthy
    working_dir: /app/packages/api
    environment:
      THEORAG_MIGRATE_PG_URI: postgres://therag:therag@pg-rag:5432/therag
    command: ["node_modules/.bin/tsx", "src/migrate.ts"]

  rag:
    image: ${THEORAG_IMAGE:-theo-rag-e2e:latest}   # built from the sibling checkout (D1)
    depends_on:
      rag-migrate:
        condition: service_completed_successfully
      mock-openai:
        condition: service_healthy
    environment:
      PORT: "8080"
      # The API refuses a superuser or BYPASSRLS role (RLS, migration 0027).
      THEORAG_PG_URI: postgres://rag_app:rag_app@pg-rag:5432/therag
      THEORAG_ADMIN_BOOTSTRAP_TOKEN: ${THEORAG_ADMIN_BOOTSTRAP_TOKEN:-e2e-bootstrap-token-change-me-min-32-chars}
      # M13 fail-closed — the direct-to-service no-key → 401 proof (D4). Without it a
      # no-key direct request would resolve a dev-mode owner Principal (not a 401).
      THEORAG_REQUIRE_CREDENTIAL: "true"
      # Hermetic embedder — collections CRUD never embeds, but point at mock-openai so
      # boot is identical to themory (no real key/network).
      OPENAI_API_KEY: dummy-key-for-mock
      OPENAI_BASE_URL: http://mock-openai:11434/v1
    ports:
      - "${E2E_RAG_PORT:-18082}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  # M40 (KEYSTONE) — the hermetic lens ForwardAuth proof. A REAL theo-lens container
  # (built from the sibling checkout, pinned M22/M37) + its plain Postgres. Unlike rag,
  # theo-lens MIGRATES ON BOOT (index.ts "migrate-then-wire"), so there is NO lens-migrate
  # one-shot — the container self-migrates once pg-lens is healthy. Plain postgres (no
  # pgvector — theo-lens uses no vector type), so no extensions step.
  pg-lens:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: theolens
      POSTGRES_PASSWORD: theolens
      POSTGRES_DB: theolens
    ports:
      - "${E2E_PG_LENS_PORT:-55436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theolens -d theolens"]
      interval: 3s
      timeout: 3s
      retries: 20

  lens:
    image: ${THELENS_IMAGE:-theo-lens-e2e:latest}   # built from the sibling checkout (pinned source)
    depends_on:
      pg-lens:
        condition: service_healthy
    environment:
      THEOLENS_PORT: "8080"
      THEOLENS_PG_URI: postgres://theolens:theolens@pg-lens:5432/theolens
      THEOLENS_PLATFORM_ADMIN_BOOTSTRAP: ${THELENS_ADMIN_BOOTSTRAP:-e2e-bootstrap-token-change-me-min-32-chars}
      # M13 fail-closed — the direct-to-service no-key → 401 proof. Without it a no-key
      # direct request would resolve a dev-mode owner Principal (not a 401).
      THEOLENS_REQUIRE_CREDENTIAL: "true"
    ports:
      - "${E2E_LENS_PORT:-18084}:8080"
    healthcheck:
      # theo-lens has no dedicated health route AND every /v1/* is scope-gated (M22), so
      # an un-keyed /v1/datasets answering 401 proves the server is up + fail-closed.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/datasets').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  # theo-cloud override: wire the rag broker (M14) + the lens broker (M38) so
  # /internal/authz/forward-rag AND /internal/authz/forward-lens are mounted.
  # {RAG,LENS}_PLATFORM_ADMIN_KEY are minted at setup by run.sh and injected on recreate.
  theo-cloud:
    environment:
      RAG_BASE_URL: http://rag:8080
      RAG_PLATFORM_ADMIN_KEY: ${RAG_PLATFORM_ADMIN_KEY:-}
      LENS_BASE_URL: http://lens:8080
      LENS_PLATFORM_ADMIN_KEY: ${LENS_PLATFORM_ADMIN_KEY:-}

  traefik:
    image: traefik:v3.3
    depends_on:
      themory:
        condition: service_healthy
      theo-cloud:
        condition: service_healthy
      rag:
        condition: service_healthy
      lens:
        condition: service_healthy
    volumes:
      # Reuse the dev STATIC config verbatim (entrypoint :8090, file provider,
      # tracing OFF — the minted Authorization must never reach a trace exporter,
      # ADR D4). DRY: the edge under test stays identical to dev.
      - ../../dev/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      # Trimmed DYNAMIC config: the /v1/memory ForwardAuth router only.
      - ./traefik/dynamic.e2e.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "${E2E_EDGE_PORT:-8090}:8090"
