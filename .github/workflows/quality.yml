# O gate que faltava. Este repo tinha `ci.yml` com DOIS jobs — `e2e` e `e2e-edge` — e
# nenhum deles verifica build, tipos, teste unitario ou lint. Um control plane com 27
# pacotes de teste Go e um dashboard TypeScript passava por PR sem que nada disso rodasse.
#
# POR QUE NAO CHAMAR `task lint` / `task test`: o Taskfile DEGRADA EM SILENCIO —
#
#   if command -v golangci-lint ...; else echo "[lint] not installed — skipping"; fi
#   cd dashboard && npm run lint || echo "[lint] not configured"
#
# — ou seja, sem a ferramenta instalada o alvo IMPRIME e PASSA. Isso e sensato num atalho
# de desenvolvimento e e exatamente o oposto do que um gate precisa: um gate que passa sem
# verificar e pior que gate nenhum, porque produz a sensacao de cobertura. Aqui as
# ferramentas sao instaladas explicitamente e o job falha quando elas falham.
name: quality
on:
  # Gate de publish.yml + PR. Sem `push:`: um commit que nao produz imagem nao tem o que o quality
  # cheque, e o commit de merge passa a ser coberto pelo gate.
  workflow_call:
    secrets:
      GOMOD_TOKEN:
        required: true
        description: PAT com leitura no modulo privado theo-contracts; um callee NAO herda secrets.
permissions:
  contents: read
jobs:
  go:
    name: go — build + test (race) + integração + vet + lint
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    # Postgres real para o passo de integracao (M149 / #405). O `health-cmd` existe para que o
    # passo espere o banco ficar pronto em vez de falhar por corrida de subida — um teste de
    # integracao que falha por timing e um teste que o time aprende a reexecutar.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: theo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      # `theo-contracts` e um modulo Go PRIVADO. Sem esta configuracao o `go build` tenta
      # baixa-lo por HTTPS anonimo e morre com "could not read Username for github.com" — o
      # que aconteceu no primeiro run deste gate. Mesmo mecanismo que o job e2e deste repo e
      # o Dockerfile ja usam; o token nunca e impresso.
      #
      # Meu `go build` LOCAL passou porque a maquina tem credencial — ponto cego da validacao
      # local que so o CI expoe. Vale registrar: validar localmente reduz o ciclo, nao
      # substitui o ambiente limpo.
      - name: Configure private module access (theo-contracts)
        # DUAS orgs de proposito. A org foi renomeada `usetheodev` -> `usetheoai`, e o
        # go.mod ja aponta para o caminho novo (`github.com/usetheoai/theo-contracts`).
        # O GitHub mantem redirect do caminho antigo, entao ele continua resolvendo — mas
        # o `insteadOf` casa por PREFIXO DE STRING, nao segue redirect: com so a regra de
        # `usetheodev/`, o fetch do caminho novo saia sem token e morria em
        # "could not read Username". Nenhum run de CI tinha exercitado isso: os 6 runs
        # verdes mais recentes sao anteriores ao rename.
        run: |
          git config --global url."https://x-access-token:${GOMOD_TOKEN}@github.com/usetheoai/".insteadOf "https://github.com/usetheoai/"
          git config --global url."https://x-access-token:${GOMOD_TOKEN}@github.com/usetheodev/".insteadOf "https://github.com/usetheodev/"
        env:
          GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}

      - name: Build
        env:
          GOPRIVATE: github.com/usetheoai/*,github.com/usetheodev/*
        run: go build ./...

      - name: Test (race detector)
        env:
          GOPRIVATE: github.com/usetheoai/*,github.com/usetheodev/*
        # `-race` nao e luxo num control plane: ele serve requisicoes HTTP concorrentes sobre
        # estado compartilhado (contas, projetos, billing). Suite single-thread verde nao prova
        # ausencia de corrida — prova que ninguem a exercitou.
        run: go test -race -count=1 ./...

      # M149 / #405 — o teste que prova a SEMANTICA do registro de uso contra Postgres de verdade.
      # Sem este passo ele nao roda em lugar nenhum e apodrece: e o unico que pega uma regressao em
      # `make_interval` ou no predicado de janela, e uma revisao apontou que dizer "provado contra
      # Postgres real" sobre um run local unico e chamar de portao o que e verificacao manual.
      # O servico sobe so aqui; o teste cria e derruba o proprio schema temporario.
      - name: Test (integration — Postgres real)
        env:
          GOPRIVATE: github.com/usetheoai/*,github.com/usetheodev/*
          AUTH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/theo_test?sslmode=disable
          # Sem isto o teste daria `t.Skip` caso a variavel nao chegasse — e um skip e verde. Com
          # isto, a ausencia da variavel FALHA o job em vez de fingir que o portao rodou.
          REQUIRE_INTEGRATION: "1"
        # O `grep` nao e zelo: sem ele, remover `-tags=integration` ou acrescentar um `-run` que nao
        # casa devolve `ok … [no tests to run]` com EXIT 0 — o job fica verde e o portao nao rodou.
        # A saida e a unica prova de que o teste executou de fato.
        #
        # `shell: bash` NAO e cosmetico: o shell default de `run:` no GitHub Actions e
        # `bash -e {0}`, SEM `pipefail`. Com `go test | tee`, o exit code visto pelo job e o
        # do `tee` — sempre 0. Um revisor reproduziu: `--- FAIL` no log e o step verde. O
        # `grep` guardava contra "no tests to run", nao contra teste FALHANDO; bastava o
        # teste nomeado imprimir PASS em algum ponto. `shell: bash` adiciona `-o pipefail` e
        # e o que faz a falha chegar ao job.
        shell: bash
        run: |
          go test -tags=integration -count=1 -timeout 3m -v ./internal/auth/... | tee /tmp/integ.log
          grep -q 'PASS: TestIntegracao_OComandoDeRegistroEValidoNoPostgres' /tmp/integ.log \
            || { echo "::error::o teste de integracao NAO executou"; exit 1; }

      - name: Vet
        env:
          GOPRIVATE: github.com/usetheoai/*,github.com/usetheodev/*
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Versao PINADA — a action resolve em runtime quando nao pinada, e foi assim que uma
          # v2.11.3 nova quebrou o theo-traefik-mcp sem nenhuma mudanca de codigo.
          #
          # POR QUE v2.12.2 E NAO a v2.6.0 dos repos irmaos: o binario do golangci-lint carrega
          # a versao de Go com que foi COMPILADO, e ela precisa ser >= a do `go.mod` do alvo.
          # Este repo esta em `go 1.26.1` (os irmaos em 1.25.x), e a v2.6.0 — compilada com
          # go1.25 — recusa: "the Go language version (go1.25) used to build golangci-lint is
          # lower than the targeted Go version". Nao e preferencia: e um piso.
          version: v2.12.2

  dashboard:
    name: dashboard — typecheck + lint + build + test
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      # Build ANTES de lint: regras type-aware precisam de um projeto que compile. Rodar lint
      # primeiro produz erro de tipo em codigo intocado e esconde o defeito real — defeito que
      # ficou meses invisivel no theo-memory.
      # `npm run build` ja e `tsc -b && vite build` — o typecheck esta dentro dele. Um passo
      # `tsc --noEmit` separado rodaria o compilador duas vezes para a mesma garantia.
      - name: Build (inclui typecheck via tsc -b)
        run: npm run build

      # B-101/e2e — `tsc -b` acima constrói SÓ o projeto raiz, cujo `include` é `["src"]`.
      # `e2e/` ficava fora de qualquer verificação de tipos, e isso cobrou: `b423ae99` moveu
      # `components/lens/lens-capabilities.ts` e `observability-screens.spec.ts` seguiu
      # importando o caminho antigo. Tipos verdes, lint verde, 2764 testes verdes — e o job
      # `e2e-ui` morrendo com "Cannot find package", que parece dependência faltando. O
      # Playwright falha o MÓDULO no carregamento, então as 26 suítes de jornada não rodavam.
      #
      # Passo separado, e não `include: ["src","e2e"]` na raiz: o `include` da raiz é o que o
      # build compila, e ampliá-lo para conseguir uma verificação mudaria o artefato de
      # carona. Este passo faz uma coisa só, e é barato — `e2e/` tem 26 arquivos.
      - name: Typecheck e2e (fora do escopo do build)
        run: npx tsc --noEmit -p e2e/tsconfig.json

      - name: Lint
        run: npm run lint

      # B-087 — este gate existia como script npm desde que a camada de mocks foi
      # contida em src/, e NUNCA rodou em CI. Ele faz grep no dist/ recem-buildado
      # para provar que `src/lib/mocks` foi tree-shaken do bundle de producao — o
      # invariante que justifica manter 3.9k LOC de mock dentro de src/ em vez de
      # num pacote separado. A auditoria confirmou que a contencao FUNCIONA hoje
      # (0 bytes de mock no dist), mas um invariante que ninguem executa e
      # documentacao, nao gate: qualquer import estatico futuro o quebraria em
      # silencio ate alguem auditar de novo.
      #
      # Reusa o dist/ do passo Build acima — nao rebuilda.
      # B-022/B-035 — o orcamento de bundle existia e nao valia nada: tres das nove
      # entradas apontavam para chunks que o manual-chunks.ts nao emite mais
      # (theo-ui, radix, lucide), e o glob do TOTAL era `dist/assets/*.js`, que
      # somava os 129 chunks — inclusive os lazy que o usuario nunca baixa no
      # primeiro paint.
      #
      # CORRECAO de 2026-08-07: este comentario dizia que as entradas obsoletas
      # produziam "um verde que nao significa nada". Um revisor testou o
      # mecanismo em diretorio isolado e o `size-limit` FALHA ALTO num glob sem
      # correspondencia ("Size Limit can't find files at ...", exit 1) — ele
      # nunca passa por apontar para arquivo inexistente. O defeito real era
      # outro, e mais simples: este passo e NOVO neste diff, entao a config
      # obsoleta nunca chegou a rodar em CI. Nao produzia verde falso; nao
      # produzia nada. O reancoramento seguia necessario — sem ele o passo novo
      # nasceria vermelho —, mas a justificativa escrita atribuia a ferramenta um
      # comportamento que ela nao tem.
      #
      # Reancorado nos chunks reais e no conjunto EAGER (os 4 com modulepreload
      # em dist/index.html), com os limites nos valores MEDIDOS. Isso trava a
      # divida onde ela esta hoje; derruba-la e o trabalho de B-021/B-073, que
      # devem tirar ~200 kB do vendor.
      - name: Bundle budget (size-limit)
        run: npx size-limit

      - name: Tree-shake check (mocks fora do bundle de producao)
        # O predicado ANTERIOR procurava a string `lib/mocks` no dist. Com
        # `sourcemap: false` (vite.config.ts) e minificacao, um caminho de modulo
        # nunca sobrevive ao bundle: o grep nao podia casar NEM quando os mocks
        # estavam la. Verificado por dois revisores independentes, que injetaram
        # `import * as m from './lib/mocks'` em main.tsx, rebuildaram, e viram o
        # passo imprimir PASS com os mocks DENTRO do bundle.
        #
        # O docblock acima condena essa exata classe de defeito uma linha antes
        # de reintroduzi-la — o que diz algo sobre revisar o proprio gate com o
        # mesmo rigor com que se revisa o codigo que ele guarda.
        #
        # Agora procura um SENTINELA: um literal de string em `src/lib/mocks/fixtures.ts`,
        # o modulo mais profundo da cadeia `index -> handlers -> fixtures`. Literal
        # sobrevive a minificacao; caminho de modulo nao. Ele e consumido por um
        # efeito colateral de modulo, de proposito — um const so exportado seria
        # descartado pelo minificador e o gate voltaria a ser tautologia por um
        # caminho novo.
        #
        # POR QUE no modulo mais profundo e nao no barrel: com o sentinela em
        # `index.ts`, o gate provava que o BARREL entrou no bundle, nao que nenhum
        # mock entrou — um `import { projects } from './lib/mocks/fixtures'`
        # arrastaria 376 linhas de dados sem acionar nada. Verificado por sonda nos
        # quatro estados: build normal PASS; import do barrel, de fixtures e de
        # handlers, os tres FAIL.
        run: |
          if grep -q '__theo_mocks_present_in_bundle__' dist/assets/*.js; then
            echo "FAIL: chunk de mocks vazou para o bundle de producao"
            exit 1
          fi
          echo "PASS: mocks tree-shaken do bundle de producao"

      # theo-cloud#276 — the dashboard suite (247 files / 1925 tests) had NEVER run in CI. No workflow
      # invoked vitest at all; the job name was honest about doing only build+lint, and nobody wired
      # the rest. The cost was measured, not feared: SIX tests were red in `develop` and had been for
      # as long as the code they cover — two suites rotted when a child component started issuing its
      # own fetch (the queued one-shot mock was consumed by whichever query won the race), one when a
      # column was renamed. `npm run build` proves the code COMPILES; only this step proves it WORKS.
      #
      # Last, on purpose: build and lint are minutes cheaper, so they fail fast. This is the slowest
      # gate in the job, and a gate that runs is worth more than a gate that runs first.
      - name: Test (vitest)
        run: npm test
