# M6 (full-chain-e2e) — the FIRST test stage in theo-cloud CI.
#
# Brings up the hermetic Model-B stack (pg-cloud + engine migrations, pg-themory,
# mock-openai, themory, kratos, theo-cloud) and runs the full e2e suite — including
# the M6 full-chain test (real Kratos login -> JWT -> BFF -> broker -> themory ->
# tenancy isolation). Mirrors `tests/e2e/run.sh` exactly (`make e2e`).
#
# NOTE: this workflow's FIRST real execution happens on push/PR — GitHub Actions
# cannot be run from a dev box. The proxy oracle is `make e2e` green locally
# (which runs the identical harness). Until the first CI run, treat the green as
# "locally proven; CI pending first push".
name: ci
on:
  pull_request: {}
  push:
    branches: [develop]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: read # pull das imagens dos vizinhos no GHCR da org
# Chaveado pela BRANCH, não por `github.ref` (mesma correção de theo-memory#129 e theo-rag).
# Um push em `develop` e o PR do MESMO commit carregam `github.ref` diferentes
# (`refs/heads/develop` vs `refs/pull/N/merge`), caem em grupos distintos e AMBOS rodam.
#
# Cada repo tem seu PRÓPRIO processo de runner, mas os cinco rodam no MESMO host de 2 vCPU / 2 GB:
# a disputa é por CPU e RAM, então um run duplicado rouba CPU dos outros quatro repositórios.
# Medido em 2026-07-27: 2 SHAs com run duplicado (par push+pull_request) nos últimos 60 runs.
concurrency:
  group: test-e2e-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      # Replicate the dev sibling layout so the compose relative mounts resolve:
      #   theo-cloud/theo-cloud  (this repo — tests/e2e lives here)
      #   theo-cloud/theo        (engine — its migrations are mounted by cloud-migrate)
      #   theo-data/theo-memory  (themory source — run.sh builds its image)
      - name: Checkout theo-cloud
        uses: actions/checkout@v4
        with:
          path: theo-cloud/theo-cloud
      - name: Checkout theo (engine — migrations)
        uses: actions/checkout@v4
        with:
          repository: usetheodev/theo
          ref: develop # sibling default branch is `main`, which lacks the current schema (e.g. accounts @ migration 000034); the e2e tests the develop-level theo-cloud, so pin develop
          # GITHUB_TOKEN is scoped to THIS repo; cross-repo private checkout needs a
          # PAT with read access to usetheodev/theo (+ theo-memory, theo-contracts).
          token: ${{ secrets.GOMOD_TOKEN }}
          path: theo-cloud/theo
      - uses: actions/setup-go@v5
        with:
          go-version-file: theo-cloud/theo-cloud/go.mod
          cache-dependency-path: theo-cloud/theo-cloud/go.sum

      # theo-contracts is a private module — let `go build` (run by make e2e) fetch
      # it over HTTPS with the PAT. NEVER printed; same mechanism as the Dockerfile.
      - name: Configure private module access (theo-contracts)
        run: |
          git config --global url."https://x-access-token:${GOMOD_TOKEN}@github.com/usetheodev/".insteadOf "https://github.com/usetheodev/"
        env:
          GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}

      # `packages: read` no bloco `permissions:` cobre o GITHUB_TOKEN para GHCR da propria
      # org — nao e preciso PAT aqui, ao contrario do checkout de repo privado.
      - name: Login to GHCR (pull das imagens dos vizinhos)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the full e2e suite (make e2e)
        working-directory: theo-cloud/theo-cloud
        env:
          GOPRIVATE: github.com/usetheodev/*
        run: |
          # As imagens dos vizinhos vem PINADAS POR DIGEST de `.github/e2e-images.env`, nao de
          # um checkout do repo deles. `run.sh` ja aceitava `*_IMAGE`; o mecanismo existia e
          # nao era usado. Ver o cabecalho daquele arquivo para o porque e o custo.
          set -a; . .github/e2e-images.env; set +a
          make e2e

      - name: Dump stack logs on failure
        if: failure()
        working-directory: theo-cloud/theo-cloud
        run: |
          docker compose -p theo-cloud-memory-e2e -f tests/e2e/docker-compose.e2e.yaml logs --tail=200 || true

  # #113 — restores automated coverage of the edge ForwardAuth confused-deputy
  # (CWE-441) closure. Brings up the SAME hermetic stack PLUS the Traefik single
  # edge (:8090) and runs ONLY the ForwardAuth tests THROUGH the edge
  # (TestEdgeForwardAuth*), which the default `e2e` job SKIPs (it runs no Traefik).
  e2e-edge:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - name: Checkout theo-cloud
        uses: actions/checkout@v4
        with:
          path: theo-cloud/theo-cloud
      - name: Checkout theo (engine — migrations)
        uses: actions/checkout@v4
        with:
          repository: usetheodev/theo
          ref: develop # sibling default branch is `main`, which lacks the current schema (e.g. accounts @ migration 000034); the e2e tests the develop-level theo-cloud, so pin develop
          token: ${{ secrets.GOMOD_TOKEN }}
          path: theo-cloud/theo
      - uses: actions/setup-go@v5
        with:
          go-version-file: theo-cloud/theo-cloud/go.mod
          cache-dependency-path: theo-cloud/theo-cloud/go.sum

      - name: Configure private module access (theo-contracts)
        run: |
          git config --global url."https://x-access-token:${GOMOD_TOKEN}@github.com/usetheodev/".insteadOf "https://github.com/usetheodev/"
        env:
          GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}

      # This job builds THREE images from source (themory + theo-rag + theo-lens)
      # on a PERSISTENT self-hosted runner, so images/layers/volumes accumulate
      # across runs. Run 30053242424 died mid-stack with `No space left on device`
      # — and because the runner could not even write its own diagnostic log, the
      # failure looked like a broken test (steps left with no conclusion, log
      # truncated). Log the disk unconditionally so that is never ambiguous again,
      # and reclaim only when actually tight — an unconditional `prune -af` would
      # throw away the warm build cache on every run.
      - name: Report disk and reclaim if tight
        run: |
          set -u
          echo "── disk before ──"; df -h /; docker system df || true
          USE=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ -z "$USE" ]; then
            # Never let the guard go silently inert: if the usage cannot be read,
            # say so LOUDLY and prune anyway — a stale cache costs minutes, a full
            # disk costs the whole run (and hides itself as a broken test).
            echo "── WARN: could not read disk usage — pruning defensively ──"
            USE=100
          fi
          if [ "$USE" -ge 80 ]; then
            echo "── / at ${USE}% (>=80%) — reclaiming ──"
            # Volumes FIRST and with NO age filter. Each e2e stack brings up
            # Postgres with volumes; tearing it down leaves them orphaned. On the
            # 2026-07-23 cleanup they were 14.16 GB of the ~21 GB reclaimed — the
            # dominant cause. Two traps this line avoids: `docker system prune`
            # does NOT touch volumes without `--volumes`, and `until=24h` would
            # skip nearly everything on a runner doing ~40 runs/day. An orphaned
            # volume has no useful age: if no container uses it, it is garbage
            # from a previous run (docker refuses to remove in-use ones).
            docker volume prune -f || true
            # Age filters DO make sense here — they protect the warm cache.
            docker system prune -f --filter 'until=24h' || true
            docker builder prune -f --filter 'until=24h' || true
            echo "── disk after ──"; df -h /; docker system df || true
          else
            echo "── / at ${USE}% — under threshold, keeping the build cache ──"
          fi

      # `packages: read` no bloco `permissions:` cobre o GITHUB_TOKEN para GHCR da propria
      # org — nao e preciso PAT aqui, ao contrario do checkout de repo privado.
      - name: Login to GHCR (pull das imagens dos vizinhos)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the edge ForwardAuth e2e (make e2e-edge)
        working-directory: theo-cloud/theo-cloud
        env:
          GOPRIVATE: github.com/usetheodev/*
          # Point run.sh at the sibling checkouts EXPLICITLY. Its relative default
          # (${ROOT}/../../theo-data/<repo>) assumes the dev-box layout; on the
          # runner the repo nests one level deeper, so the default resolved to a
          # path that does not exist.
        run: |
          set -a; . .github/e2e-images.env; set +a
          make e2e-edge

      - name: Dump stack logs on failure
        if: failure()
        working-directory: theo-cloud/theo-cloud
        run: |
          docker compose -p theo-cloud-memory-e2e -f tests/e2e/docker-compose.e2e.yaml -f tests/e2e/docker-compose.edge.e2e.yaml logs --tail=200 || true
