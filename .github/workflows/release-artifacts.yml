# AM6 — theo-cloud repo artifact release: 2 images (cloud-API + dashboard), to GHCR.
# Calls the reusable build-publish workflow hosted in the theo repo (cross-repo).
# Ref = @develop today (resolves to the branch carrying build-publish.yml). Cuts over to a
# pinned theo release tag at release time (owner-gated) — same pre-release convention as the
# `theo-contracts` replace => ../theo-contracts → pinned-tag cutover (see theo-cloud/CLAUDE.md
# § Invariants). EC-3 tag-first: the pinned tag must carry build-publish.yml before cutover.
name: release-artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  images:
    strategy:
      matrix:
        include:
          - { image: theo-cloud,     dockerfile: Dockerfile,           context: . }
          - { image: theo-dashboard, dockerfile: dashboard/Dockerfile, context: dashboard }
    uses: usetheodev/theo/.github/workflows/build-publish.yml@develop   # cutover to pinned tag at release (owner-gated)
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
