# AM6 — theo-cloud artifact pipeline, dual-channel + low-cost.
#   develop push  → DEV channel: build only CHANGED images, :develop/:develop-<sha>, NO sign
#   tag v*        → RELEASE channel: build BOTH images, SBOM + provenance + keyless cosign
#   workflow_dispatch → build BOTH (unsigned), manual
# Calls the reusable build-publish workflow hosted in the theo repo (cross-repo).
# Ref = @develop today (resolves to the branch carrying build-publish.yml); cuts over to a pinned
# theo release tag at release time (owner-gated) — same convention as theo-contracts replace→pin
# (see theo-cloud/CLAUDE.md § Invariants). EC-3 tag-first: the pinned tag must carry build-publish.yml.
name: publish
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Menor privilegio. Este job so faz checkout, paths-filter e jq — nao escreve em registry
    # nem cunha token OIDC. E e exatamente onde roda `dorny/paths-filter`, o unico terceiro da
    # cadeia: nao ha razao para ele herdar `packages: write` + `id-token: write` do workflow.
    permissions:
      contents: read
    outputs:
      images: ${{ steps.set.outputs.images }}
      sign: ${{ steps.set.outputs.sign }}
      # O rotulo que o painel /status mostra na coluna Version. Composto AQUI, e nao no ponto de
      # uso, porque este job ja e o dono das decisoes de canal: para tag, `ref_name` JA e a versao
      # (`v1.2.3`) e nao deve ganhar sufixo; para develop, `ref_name` sozinho e so o nome do canal.
      version_label: ${{ steps.set.outputs.version_label }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            theo-cloud: ['cmd/**', 'internal/**', 'go.mod', 'go.sum', 'Dockerfile']
            theo-dashboard: ['dashboard/**']
      - id: set
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          ALL='[{"image":"theo-cloud","dockerfile":"Dockerfile","context":"."},{"image":"theo-dashboard","dockerfile":"dashboard/Dockerfile","context":"dashboard"}]'
          # MEDIDO em 2026-07-31 na /status implantada: nove servicos mostravam `develop-<sha>` e o
          # theo-cloud mostrava `develop` — a unica linha do painel que nao dizia QUAL build estava
          # rodando. Em tag, `ref_name` ja E a versao e nao leva sufixo; fora dela, o nome do canal
          # sozinho nao identifica nada, entao carrega o commit curto.
          if [ "$IS_TAG" = "true" ]; then
            echo "version_label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # SHORT numa atribuicao propria: dentro de `echo "...$(...)"` o `set -e` NAO aborta se
            # o comando substituido falhar — o status vira o do echo. Aqui aborta.
            SHORT=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            echo "version_label=${GITHUB_REF_NAME}-${SHORT}" >> "$GITHUB_OUTPUT"
          fi
          if [ "$IS_TAG" = "true" ] || [ "$IS_DISPATCH" = "true" ]; then
            echo "images=$ALL" >> "$GITHUB_OUTPUT"
            echo "sign=$IS_TAG" >> "$GITHUB_OUTPUT"
          else
            CH="${CHANGES:-[]}"
            SEL=$(printf '%s' "$ALL" | jq -c --argjson ch "$CH" '[.[] | select(.image as $i | $ch | index($i))]')
            echo "images=$SEL" >> "$GITHUB_OUTPUT"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          fi
  # --- Gates: nenhuma imagem sai com um deles vermelho -------------------------------------
  #
  # MEDIDO na janela da auditoria de 2026-07-30: 12 commits publicaram ao menos uma imagem com um
  # gate vermelho (17 pushes de imagem no total); 3daf3663 subiu DUAS imagens com ci, quality e
  # security-sast falhando os tres. O host converge :develop em ~5 min, entao cada um foi ao ar.
  #
  # `needs:` e o mecanismo — nao um passo de saida antecipada dentro do job. `needs:` aborta ANTES
  # do job comecar, entao nenhuma credencial de registry e adquirida e nao ha push parcial a
  # desfazer.
  #
  # `workflow_run` e PROIBIDO como gate (tres rejeicoes independentes neste workspace): e assincrono
  # e `github.sha` vira o do evento ANTERIOR, o que quebra o compare/main...$SHA do promotion guard.
  #
  # O `if:` replica a condicao do `images`: sem ele, um commit so de documentacao rodaria os tres
  # gates por inteiro e publicaria nada — piorando os 4.812 runner-segundos que a auditoria ja
  # mediu em commits de docs. O gitleaks continua vendo esses commits pelo `push:` proprio do
  # security-sast.yml, que por isso e o unico dos tres que manteve o gatilho avulso.
  gate-ci:
    needs: plan
    if: ${{ needs.plan.outputs.images != '[]' && needs.plan.outputs.images != '' }}
    uses: ./.github/workflows/ci.yml
    secrets:
      GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}

  gate-quality:
    needs: plan
    if: ${{ needs.plan.outputs.images != '[]' && needs.plan.outputs.images != '' }}
    uses: ./.github/workflows/quality.yml
    secrets:
      GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}

  gate-sast:
    needs: plan
    if: ${{ needs.plan.outputs.images != '[]' && needs.plan.outputs.images != '' }}
    uses: ./.github/workflows/security-sast.yml
    secrets:
      GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}

  images:
    needs: [plan, gate-ci, gate-quality, gate-sast]
    if: ${{ needs.plan.outputs.images != '[]' && needs.plan.outputs.images != '' }}
    # The reusable declares these scopes, and GitHub refuses at startup — with no log — a
    # reusable that asks for more than its caller grants (usetheoai/theo#436). `attestations`
    # is for its GitHub-native provenance; `id-token` also assumes the ECR publish role.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    uses: usetheoai/theo/.github/workflows/build-publish.yml@b7aeb94c64856304e709f33f4d5dd94d97e2b161 # develop
    with:
      image: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile }}
      context: ${{ matrix.context }}
      # O canal que a producao CONSUME e :develop. Deixar scan e assinatura presos a tags protegia
      # artefatos que este host nunca puxa, e nao protegia o que ele executa.
      trivy: true
      sign: true
      # A MESMA verdade que o metadata-action grava em org.opencontainers.image.revision no mesmo
      # run. Binario e label viram duas projecoes de um unico fato, entao o criterio de aceite do
      # M22 (`/v1/version` bate com o label da imagem em execucao) e verdadeiro por construcao.
      #
      # B-270 — isto ia como `git_sha:` e `version_label:`, dois inputs que a COPIA VENDORIZADA
      # deste repo declarava e que o reusable compartilhado nunca teve. Quando `03195817` trocou a
      # copia pelo reusable de `usetheoai/theo`, o GitHub passou a recusar o workflow INTEIRO no
      # startup — cinco runs seguidos mortos em menos de um segundo, incluindo as tags v1.0.0 e
      # v1.0.1, que sairam sem imagem nenhuma atras delas.
      #
      # `build_args` e o input que o reusable JA declara e repassa aos dois builds (o do Trivy e o
      # do push). O `Dockerfile:58-59` ja declara `ARG VERSION` e `ARG GIT_SHA` e os injeta por
      # ldflags, entao o canal existia dos dois lados — faltava usa-lo.
      build_args: |
        VERSION=${{ needs.plan.outputs.version_label }}
        GIT_SHA=${{ github.sha }}
      # `verify` fica preso a tag de proposito (EC-3): o cosign verify resolve contra Rekor/Fulcio
      # DEPOIS do push, entao uma indisponibilidade do Sigstore vermelharia um run cuja imagem ja
      # publicou — e o reconciliador convergiria numa imagem que a pipeline diz ter falhado.
      verify: ${{ needs.plan.outputs.sign == 'true' }}
      # Amazon ECR, the registry production pulls from (usetheoai/theo#435). Both are
      # repository variables; unset, the reusable skips ECR and GHCR publishes as before.
      ecr_registry: ${{ vars.ECR_REGISTRY }}
      aws_role_arn: ${{ vars.AWS_IMAGE_PUBLISH_ROLE_ARN }}
      # B-270 — `attest:` saiu daqui pelo mesmo motivo: o reusable compartilhado nao o declara.
      # Ele FUNDE SBOM + provenance(mode=max) + cosign sob o unico `sign:` acima, que ja vai `true`.
      #
      # O que se perde e a otimizacao, nao a garantia: a copia vendorizada separava assinar (sempre)
      # de exportar SBOM (so na release), e agora o export pesado roda em todo push para develop.
      # Recuperar isso exige um input novo no reusable compartilhado — mudanca em `usetheoai/theo`,
      # que alcanca todos os repos que o chamam. Registrado como B-271 em vez de resolvido aqui
      # deixando de assinar o que producao consome, que e a troca que o comentario acima recusa.
    # Explicito, nao `secrets: inherit`. O reusable declara TRES secrets, todos opcionais;
    # herdar tudo passa cada segredo do repo para um workflow que usa no maximo tres — e o
    # semgrep sinaliza `secrets-inherit` por isso mesmo. A enumeracao nao custa nada.
    secrets:
      GOMOD_TOKEN: ${{ secrets.GOMOD_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
