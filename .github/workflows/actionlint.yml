# O gate mais barato do repositorio, e o unico que pega uma classe inteira de defeito:
# um workflow com YAML invalido NAO FALHA — ele simplesmente nao roda. Precedente medido
# no theo-db (95 de 100 runs perdidos em silencio) e reproduzido no theo-lens, onde
# `paths` + `paths-ignore` no mesmo evento matava o sdk-go no PARSE: jobs=0, sem log,
# vermelho sem causa visivel.
name: actionlint
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: inputs de reusable cross-repo declarados pelo callee (B-270)
        # O `actionlint` abaixo SAI 0 neste defeito, e a razao e' estrutural: ele valida um
        # reusable LOCAL, e nao busca o arquivo de outro repositorio para comparar. Foi por isso
        # que `publish.yml` passou a mandar tres inputs que o reusable compartilhado nao declara e
        # ninguem viu — seis runs mortos em menos de um segundo, e duas releases com zero imagem.
        #
        # A falha e' invisivel pela API (`startup_failure` nao traz mensagem e `runs/{id}/jobs` vem
        # vazio), entao ela LE como um workflow que nunca rodou. Mesma classe do defeito que este
        # workflow inteiro existe para pegar, uma camada acima.
        #
        # FALHA FECHADO: se o token nao alcancar o repo do callee, o script reporta NAO VERIFICADO
        # e sai 1. Um gate que fica quieto quando nao consegue conferir reporta cobertura que nao
        # tem — que e' exatamente como se chega em seis runs mortos sem ninguem notar.
        env:
          GH_TOKEN: ${{ secrets.GOMOD_TOKEN }}
        run: python3 .github/scripts/check_reusable_inputs.py

      - name: actionlint (workflows + shellcheck dos blocos run:)
        # Imagem fixada por DIGEST — nao `bash <(curl .../main/...)`, que baixa e executa um
        # script de branch mutavel no runner. Este repo pina actions por SHA; a disciplina de
        # supply-chain nao pode falhar justamente no gate de qualidade.
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
