# e2e-ui — as jornadas do DASHBOARD, no navegador, contra mocks.
#
# POR QUE ESTE ARQUIVO EXISTE. Até 2026-08-02 **nenhum job de CI executava Playwright neste
# repositório**. Os specs em `dashboard/e2e/` só rodavam quando alguém lembrava de rodá-los à mão —
# incluindo o que mata a mutação de `resolveActiveMenu`, guard que existe justamente porque aquela
# omissão custou um milestone inteiro (M23/M24: quatro telas declaradas e inalcançáveis por clique).
#
# O CHECK CHAMADO `e2e` NÃO É ESTE, E A CONFUSÃO DE NOME FOI PARTE DO DEFEITO. Os checks `e2e` e
# `e2e-edge` (em `e2e-drift.yml` / `Makefile`) exercitam o BACKEND — theo-cloud ↔ TheMemory contra
# endpoints reais, e o ForwardAuth pela borda Traefik. Ler `e2e → pass` como "a jornada da tela
# passou" foi um erro real de leitura desta sessão. Daí o nome distinto: `e2e-ui`.
#
# O QUE ESTE JOB **NÃO** COBRE — leia antes de concluir qualquer coisa a partir do verde dele:
#
#   • Roda contra **mocks** (`VITE_USE_MOCKS=true`, ligado pelo `webServer` do
#     `playwright.config.ts` sob `CI`). Portanto prova a **jornada da INTERFACE** — que a tela
#     navega, renderiza conteúdo e reage —, **NÃO** a integração com a borda, o BFF ou os serviços.
#   • Um verde aqui **não** significa "o sistema funciona". Significa "a tela não regrediu contra o
#     contrato que os mocks descrevem". A prova contra a instância implantada é outra coisa, é
#     manual hoje, e depende de credencial.
#   • Só `chromium`. Os outros três projetos do config (firefox / webkit / mobile-chrome) ficam de
#     fora por custo; um defeito específico de engine não é pego aqui.
#
# ESCOPO DECLARADO, NUNCA SILENCIOSO. O job roda uma LISTA EXPLÍCITA de specs, não `e2e/`, porque
# parte da suíte já falhava antes deste trabalho. Incluí-los faria o job **nascer vermelho** — e um
# check que já chega vermelho é um check que se aprende a ignorar, o oposto do que ele existe para
# fazer. Ficam FORA, declarados aqui, para entrarem um a um conforme forem corrigidos.
#
# ESTADO MEDIDO (`--reporter=json`, suíte inteira, 2026-08-02): **16 casos vermelhos em 6 arquivos**,
# de 87 casos em 17 arquivos. Os seis, com a CAUSA de cada um — porque a causa decide quem pode
# consertar:
#
#   • `project-connect` (1 verde · 1 vermelho · 2 PULADOS) — o arquivo é `mode: 'serial'`, e isso
#     mudou a leitura: enquanto o Cenário 1 falhava, os outros três eram **pulados, nunca
#     executados**. Uma contagem que trate "pulado" como "não-falhou" reporta 3 verdes que não
#     existem — foi o erro da primeira classificação deste cabeçalho, corrigido por medição
#     (`--reporter=json`, contando `skipped` à parte). O Cenário 1 está consertado e é real: o
#     projeto do cenário não existia em fixture algum (`demo`), então o guard renderizava "Project
#     not found" e o botão de instalar era procurado numa tela que nunca foi a de conexão; hoje usa
#     `acme-ml-pipeline`, o único que o dublê devolve como `connected: false`. O Cenário 2 falha por
#     outra razão, mais funda: ele intercepta `/engine/api/v1/projects/*/connect` pela REDE, e sob
#     `VITE_USE_MOCKS=true` essa rota é servida **em processo** pela camada de dublê — o
#     `page.route` nunca dispara. Os Cenários 2–4 precisam de outra alavanca, não de outro fixture.
#   • `journeys` (2/8) — **renomeação, não redesenho.** CORRIJO O QUE ESTE CABEÇALHO AFIRMAVA: eu
#     havia escrito que `view logs` e `rollback to here` "não existem mais" e que reescrever exigia
#     uma decisão de produto. **Falso, e o erro tem uma forma reconhecível** — eu li a lista de
#     botões da tela de deploy que FALHOU e afirmei sobre o produto inteiro. As duas afordâncias
#     existem: `Logs` é aba (`…/deployments/{id}/logs`) e `Rollback` é botão na tela de deploy
#     BEM-SUCEDIDO, onde faz sentido — `RollbackDialog` está fiado em `deployment-detail-layout.tsx`.
#     Olhar um estado e concluir sobre todos é o mesmo erro que este arquivo já registra em outro
#     lugar. Resta um gap menor e real: a aba `Logs` renderiza os filtros e NENHUMA linha, porque o
#     dublê não tem entradas de log para aquele build — a asserção de conteúdo não tem lastro.
#   • `dashboard-m12-fase-a-bundle-grep-migration` (3/22) — os 19 casos de DOM passam; os 3
#     vermelhos são **baselines de screenshot desatualizadas por redesenho**. Comparadas as
#     imagens (não deduzido): a baseline é de **tema claro com o logotipo antigo**, e o produto
#     hoje renderiza **tema escuro com o logotipo novo** — daí 99% dos pixels diferentes, que é
#     redesenho, não regressão. Regravar é `--update-snapshots`, MAS não é mecânico por dois
#     motivos: (a) aceita-se o visual atual como canônico, e isso é decisão de produto; (b)
#     baseline gravada nesta máquina pode não bater no runner — fontes e rasterização diferem —,
#     então uma regravação local arrisca um check que passa aqui e falha no CI, que é o pior
#     resultado possível para um teste de imagem. Regravar **no runner** é o caminho correto.
#
# CORREÇÃO DE UMA AFIRMAÇÃO ANTERIOR DESTE CABEÇALHO: ele dizia haver "um caso em `deploy-timeline`".
# **Falso hoje** — mede 10/10 verde, isolado (3 execuções) e dentro da suíte inteira. Não foi
# contenção sob paralelismo, hipótese que foi testada e descartada. Não sei dizer se o caso foi
# corrigido por outra frente ou se a contagem original estava errada, e afirmar qualquer uma das
# duas sem evidência seria inventar. Por medir verde e estável, `deploy-timeline` ENTROU no job.
#
# `promptly-journey-live` fica fora por outra razão: aponta para a instância implantada e exige
# credencial — é trabalho separado. Ele aparece "ok" na suíte por se auto-pular, não por passar.
#
# ENTRARAM DEPOIS (todos em 2026-08-02, com a razão de cada um):
#
#   • `a11y` — asserções posicionais/por substring casavam o elemento errado; uma delas reprovava
#     um produto CORRETO. Defeito de teste.
#   • `deploy-timeline` — ver a correção acima.
#   • `observability-screens` — a lista de telas era uma CÓPIA À MÃO do menu e derivou em silêncio
#     (`Guards`→`Monitors` no M136; `Webhooks` acrescentado). Passou a derivar de
#     `LENS_CAPABILITIES`, o registro único que existe desde o M70 exatamente para isso. O segundo
#     teste do arquivo foi REMOVIDO, não consertado: ele prometia acusar tela nova no menu e nunca
#     conseguiu — filtrava candidatos por uma lista literal com os mesmos nomes do manifesto, então
#     `Webhooks` entrou e ele ficou verde e mudo.
#   • `j10-environments` — apontava para `/environments`, retirado no M20 (hoje redirect); a tela
#     vive em `/projects/:name/environments`. O dublê também era anterior ao M20: sem o campo
#     `project`, as três entradas caíam no filtro e a tela renderizava vazia com 200 em tudo.
#   • `recovery` — a premissa "visitante sem sessão" nunca era estabelecida. O produto está certo:
#     com sessão ativa, `/recovery` mostra de propósito "You're already signed in" (fecho de Red
#     Team, `theo-cloud#54`). A alavanca `__THEO_MOCK_LOGGED_OUT` já existia e é a mesma do
#     `login.spec.ts`. Um terceiro caso falhava por outro motivo, também medido: sob mocks o
#     `ui.action` é o sentinela `#mock-submit-recovery`, que o `fetch` resolve contra o documento
#     atual — o POST sai para a própria URL da página, não para `/self-service/recovery`.
name: e2e-ui

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  e2e-ui:
    name: e2e-ui — jornadas do dashboard (mocks, chromium)
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      # `--with-deps` traz as bibliotecas de sistema do runner; sem elas o navegador falha ao
      # iniciar com um erro de linker que não se parece em nada com "falta dependência".
      # Só chromium: instalar os três engines multiplicaria o tempo sem cobrir mais jornada.
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # O `webServer` do `playwright.config.ts` sobe o Vite com `VITE_USE_MOCKS=true` porque
      # `CI` está definido — não há passo de servidor aqui de propósito, para que o config
      # continue sendo a fonte única de como a suíte é servida.
      - name: Run journey specs
        run: |
          npx playwright test --project=chromium \
            e2e/skills-journey.spec.ts \
            e2e/promptly-journey.spec.ts \
            e2e/guardrails-journey.spec.ts \
            e2e/login.spec.ts \
            e2e/device-verify.spec.ts \
            e2e/device-success.spec.ts \
            e2e/verification.spec.ts \
            e2e/knowledge-base.spec.ts \
            e2e/a11y.spec.ts \
            e2e/deploy-timeline.spec.ts \
            e2e/observability-screens.spec.ts \
            e2e/j10-environments.spec.ts \
            e2e/recovery.spec.ts

      # O relatório só interessa quando algo falha; guardá-lo sempre encheria o storage do repo
      # com artefatos de runs verdes que ninguém abre.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
